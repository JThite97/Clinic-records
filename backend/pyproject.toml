[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "clinic-records"
version = "1.0.0"
description = "Clinic Records V1 - local server (FastAPI + SQLCipher)"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "sqlalchemy>=2.0",
  "pydantic>=2.7",
  "python-multipart>=0.0.9",
  "argon2-cffi>=23.1",
  "cryptography>=42",
  "sqlcipher3-wheels>=0.5",
  "reportlab>=4.2",
  "pyzipper>=0.3.6",
  "rapidfuzz>=3.9",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "pyinstaller>=6.6"]

[project.scripts]
clinic-server = "clinic.main:run"

[tool.setuptools.packages.find]
include = ["clinic*"]

[tool.setuptools.package-data]
"clinic.data" = ["*.json"]
"clinic.mobile" = ["*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]
